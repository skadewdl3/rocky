name: Rebuild website
on: [push]

jobs:
  webhook_push:
    if: ${{ secrets.CLOUDFLARE_WEBHOOK_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Push CF webhook
        run: |
          curl --fail --show-error --silent \
            -X POST \
            "${{secrets.CLOUDFLARE_WEBHOOK_URL}}"
        
